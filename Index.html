
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHANCHIVY PROFILE</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  background: #050810;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  text-align: center;
  padding: 20px;
  background: #0b1421;
  border-bottom: 1px solid #00e5ff;
}
.online {
  display: inline-block;
  color: #00ff9d;
  background: #103329;
  padding: 7px 15px;
  border-radius: 20px;
  font-size: 13px;
}
.profile {
  text-align: center;
  padding: 40px 15px;
  background: radial-gradient(circle, #12354c, #050810 75%);
}
.avatar {
  width: 105px;
  height: 105px;
  margin: auto;
  border: 3px solid #00e5ff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 35px;
  font-weight: bold;
  color: #00e5ff;
  box-shadow: 0 0 25px #00dfff;
}
.profile h1 {
  color: #00e5ff;
  margin: 18px 0 8px;
  text-shadow: 0 0 15px #00dfff;
}
.subtitle {
  color: #9cb5c9;
  letter-spacing: 2px;
  font-size: 13px;
}
.intro {
  margin-top: 20px;
  color: #d4e3ef;
}
.container {
  max-width: 600px;
  padding: 20px;
  margin: auto;
}
.title {
  text-align: center;
  color: #00e5ff;
  margin: 20px 0;
}
.store {
  background: #101d2c;
  border: 1px solid #008db5;
  border-radius: 15px;
  padding: 23px;
  box-shadow: 0 0 18px #00394c;
}
.store h2 {
  color: #00e5ff;
  margin-bottom: 15px;
}
.store p {
  color: #a9bed0;
  line-height: 1.8;
}
.selling {
  color: #00ff9d;
  font-size: 12px;
  margin-bottom: 15px;
}
button {
  width: 100%;
  border: none;
  padding: 15px;
  margin-top: 20px;
  border-radius: 9px;
  background: #00dfff;
  color: #001018;
  font-size: 16px;
  font-weight: bold;
  box-shadow: 0 0 15px #00bfff;
}
button:active {
  transform: scale(.97);
}
footer {
  text-align: center;
  padding: 25px;
  color: #71879b;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <span class="online">● ONLINE</span>
</header>

<section class="profile">
  <div class="avatar">PC</div>
  <h1>PHANCHIVY</h1>
  <div class="subtitle">PROFILE • KEY SELLER</div>
  <p class="intro">
    Xin chào! Chào mừng đến với profile của mình.
  </p>
</section>

<main class="container">

  <h2 class="title">⚡ KEY STORE</h2>

  <div class="store">
    <div class="selling">● ĐANG BÁN</div>
    <h2>KEY VOHOAINAM</h2>
    <p>
      KEY STORE<br>
      Nhanh chóng • Tiện lợi<br>
      Hỗ trợ khách hàng
    </p>

    <button onclick="alert('Vui lòng liên hệ PHANCHIVY để mua KEY!')">
      MUA KEY NGAY
    </button>
  </div>

</main>

<footer>
  © 2026 PHANCHIVY PROFILE
  <br>POWERED BY VOHOAINAM
</footer>

</body>
</html>
